name: CI

# Deux vérifications indépendantes :
#  - jvm-tests  : le cœur non-Android, compilé et testé en quelques secondes ;
#  - build-apk  : la compilation Android complète, qui exige le SDK et produit un APK.
# La seconde est celle qui manquait : aucun APK n'a jamais été construit dans l'atelier.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm-tests:
    name: Tests JVM (cœur non-Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compiler et exécuter les tests
        working-directory: app
        run: |
          chmod +x verify-jvm.sh
          ./verify-jvm.sh

  build-apk:
    name: APK debug (SDK Android)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Installer la plateforme 36
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          sdkmanager --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Compiler l'APK
        working-directory: app
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: selene-debug-apk
          path: app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publier les rapports de compilation
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/app/build/reports/**
            app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
