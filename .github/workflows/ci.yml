name: CI

# Deux vérifications indépendantes :
#  - jvm-tests  : le cœur non-Android, compilé et testé en quelques secondes ;
#  - build-apk  : la compilation Android complète, qui exige le SDK et produit un APK.
# La seconde est celle qui manquait : aucun APK n'a jamais été construit dans l'atelier.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm-tests:
    name: Tests JVM (cœur non-Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compiler et exécuter les tests
        working-directory: app
        run: |
          chmod +x verify-jvm.sh
          ./verify-jvm.sh

  build-apk:
    name: APK debug (SDK Android)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pas d'android-actions/setup-android : l'action tente d'installer le paquet « tools »,
      # supprimé du dépôt Android, et échoue avant même de compiler. Le runner fournit déjà le SDK.
      - name: Installer la plateforme 36
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "sdkmanager : $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools" 2>&1 | tail -5
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Compiler l'APK (release minifié, un APK par ABI)
        working-directory: app
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace
          echo "=== taille des APK produits ==="
          find app/build/outputs/apk -name '*.apk' -exec du -h {} \;

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: selene-apk
          path: app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publier les rapports de compilation
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/app/build/reports/**
            app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
